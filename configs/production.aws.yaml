# AWS RDS PostgreSQL Configuration Template
# This is a template for future AWS support - not yet implemented

version: 1
provider: aws
environment: "production"

postgres:
  # AWS-specific configuration
  region: "us-west-2"
  instance_class: "db.r5.xlarge"
  engine_version: "16.1"
  storage_type: "gp3"
  allocated_storage: 100  # GB

  # Network configuration
  vpc_id: "vpc-xxxxxxxx"
  subnet_group: "prod-db-subnet-group"
  security_groups:
    - "sg-xxxxxxxx"  # Replace with your security group

  # Database configuration
  primary:
    identifier: "pgbench-prod-primary"
    database: "pgbench"
    user: "postgres"
    # Note: Password should be in AWS Secrets Manager, not in this file
    # Reference: arn:aws:secretsmanager:region:account:secret:name

  replicas:
    count: 3
    identifier_prefix: "pgbench-prod-replica-"
    # AWS read replicas are automatically created with replication

replication:
  enabled: true

  # Naming: publication on the primary, subscriptions on each replica.
  publication_name: "pgbench_pub"
  subscription_prefix: "pgbench_sub_"

  # Explicit tables keeps this safe + predictable (and matches pgbench schema).
  tables:
    - "public.pgbench_accounts"
    - "public.pgbench_branches"
    - "public.pgbench_tellers"
    - "public.pgbench_history"

  # For production: you might want to enable copy_data for initial sync
  copy_data: true

  # Let Postgres manage the logical slot
  create_slot: true

  # Validation settings for "replication completed" checks.
  verify:
    poll_interval: "1s"      # Slower polling for production
    timeout: "5m"            # Longer timeout for production
    strict_lsn_match: true

  replica_identity:
    default: "auto"   # auto | full
    force_full_for:
      - "public.pgbench_accounts"

# AWS-specific features (not yet supported)
